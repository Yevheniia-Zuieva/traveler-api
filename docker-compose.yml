name: travel_planner

services:
  # Primary (master)
  postgres:
    image: postgres:16-alpine
    container_name: travel_planner_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-travel_planner_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "synchronous_commit=on"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-migrations:ro
      - ./db/replications/publisher:/docker-entrypoint-replications:ro
      - ./db/replications/common:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - travel_planner_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-travel_planner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Standby (synchronous physical replica)
  postgres_sub:
    image: postgres:16-alpine
    container_name: travel_planner_replica
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: ${REP_PASSWORD:-rep_pass}
    entrypoint:
      - "bash"
      - "-c"
      - |
        set -e
        if [ -z "$$(ls -A "$$PGDATA" 2>/dev/null)" ]; then
          echo "Waiting for primary (postgres) to be ready..."
          until pg_isready -h postgres -p 5432 -U repuser -d ${DB_NAME:-travel_planner_db}; do
            sleep 2
          done
          echo "Running pg_basebackup from primary..."
          pg_basebackup -h postgres -p 5432 -U repuser -D "$$PGDATA" -Fp -Xs -P -R -S physical_slot_1 -C
          echo "primary_conninfo = 'host=postgres port=5432 user=repuser password=${REP_PASSWORD:-rep_pass} application_name=replica_1'" >> "$$PGDATA/postgresql.auto.conf"
          chown -R postgres:postgres "$$PGDATA"
          chmod 0700 "$$PGDATA"
        fi
        exec docker-entrypoint.sh postgres -c listen_addresses='*' -c hot_standby=on
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel_planner_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-travel_planner_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql

  # Сервіс FastAPI додатку
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: travel_planner_api
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-travel_planner_db}
    ports:
      - "${APP_PORT:-4567}:4567"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel_planner_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - app_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

volumes:
  postgres_data:
    driver: local
  postgres_replica_data:
    driver: local
  app_logs:
    driver: local

networks:
  travel_planner_network:
    driver: bridge