name: Performance Tests (k6)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  performance-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: travel_planner_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d travel_planner_db -f docs/schema.sql
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/travel_planner_db

      - name: Install Grafana k6
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Start App & Run k6 Tests
        run: |
          # 1. Запуск FastAPI у фоні з виводом логів у файл app.log
          uvicorn main:app --host 0.0.0.0 --port 3000 > app.log 2>&1 &
          
          echo "Waiting for FastAPI server to start..."
          SERVER_UP=false
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/health | grep -q "status"; then
              echo "FastAPI is up and running!"
              SERVER_UP=true
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done

          # Якщо сервер не піднявся, показуємо логи та зупиняємо крок
          if [ "$SERVER_UP" = false ]; then
            echo "=== FASTAPI STARTUP LOGS ==="
            cat app.log
            exit 1
          fi

          # 2. Запуск тесту k6
          k6 run tests/performance-tests/ci-performance-test.js
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/travel_planner_db
          BASE_URL: http://127.0.0.1:3000